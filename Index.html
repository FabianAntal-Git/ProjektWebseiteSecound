<!DOCTYPE html>

</head>
	<header>	
		<div class="flex-container">
			<div class="translusent">

			</div>
			
				<div class="Home-container">
					<div class="Logo">Burger's</div>
					<div class="spacer"></div>

					<div class="NaviBut-container">	
						<button class="NaviBut" id="NaviBut"></button>
							
							<nav class="Navi" id="Navi">
								<ul>
									<li class="list-Item"><a class="NavText" href="#Specials">Home</a></li>
									<li class="list-Item"><a class="NavText" data-i18n="Nav_Rezepte" href="#NeusteRezepte">Neuste Rezepte</a></li>
									<li class="list-Item"><a class="NavText" data-i18n="Nav_Speisekarte" href="#Speisekarte">Speisekarte</a></li>
									<li class="list-Item"><a class="NavText" data-i18n="Nav_Team" href="#DasTeam">Das Team</a></li>
									<li class="list-Item"><a class="NavText" data-i18n="Nav_Impressum" href="#Impressum">Impressum</a></li>
								</ul>	
							</nav>
					</div>
				</div>

			<div class="translusent">
				<nav class="page-navigation" id="page-navigation">
        			<ul class="lang-list">
						<li class="lingua"><img src="./img/DE_Symbol.jpg" class="lang_symbol"><a href="index.html" class="lingua-a" id="de" data-i18n="nav_german">DE</a></li>
						<li class="lingua"><img src="./img/EN_Symbol.jpg" class="lang_symbol"><a href="index.html" class="lingua-a" id="en" data-i18n="nav_english">EN</a></li>
					</ul>
				</nav>
			</div>
		</div>

	<body>
			<div id="disclaimer-popup" class="popup-overlay">
				<div class="popup-content">
					<h2 data-i18n="popup_datenschutz"></h2>
					<p data-i18n="popup_datenschutz_inhalt"></p>
					<p data-i18n="popup_datenschutz_inhalt2"></p>
					<button data-i18n="popup_schliessen"></button>
				</div>		
			</div>
		<main>
			<section  class="Home" id="Specials">
					<div class="mySlides fade" >
						<img src="./img/BurgerSlide1.jpg" class="img1" alt="Tripple Jalapenos Burger">
					</div>

					<div class="mySlides fade" >
						<img src="./img/BurgerSlide2.jpg" class="img1" alt="Tripple Royal TS Burger">
					</div>

					<div class="mySlides fade" >
						<img src="./img/BurgerSlide3.jpg" class="img1" alt="Tripple Salad Cheese Burger">
					</div>

					<!-- The dots/circles -->
					<div class="dotBox">
						<button class="dot" ></button>
						<button class="dot" ></button>
						<button class="dot" ></button>
					</div>
			</section>
			<section class="Rezepte" id="NeusteRezepte">
				<h1 data-i18n="page_title_Rezepte"></h1>
					<section class="sectionProducts">
						<img class="productPicture" src="./img/Burger1.webp" alt="Rindfleisch Burger Deluxe">
							<section class="Description">
								<h2 data-i18n="page_subtitle_Specials_1"></h2>
								<p data-i18n="page_description_Specials_1"></p>
							</section>
					</section>
					<section class="sectionProducts">
							<section class="Description">
								<h2 data-i18n="page_subtitle_Specials_2"></h2>
								<p data-i18n="page_description_Specials_2"></p>
							</section>
							<img class="productPicture"src="./img/Burger2.webp" alt="Pulled Pork Burger">
					</section>
			</section>

			<section  class="Speisekarte" id="Speisekarte" >

		</section>
			<section  class="DasTeam" id="DasTeam">

			<section class="sectionDasTeam">
				<p data-i18n="page_description_Team"></p>
				<img src="./img/Das_Team.jpg" class="img1"alt="Das Team">
			</section>
		</section>

	<footer>
			<section  class="Impressum" id="Impressum">
				<h3>Fabian Antal @ DEKRA Günzburg</h3>
